<input
  type="text"
  name="search"
  class="form-control mb-4"
  placeholder="Search By Title"
  [(ngModel)]="searchTitle">

<div class="row">

  @for (conf of list; track conf.title) {

    @if (conf.title.toLowerCase().includes(searchTitle.toLowerCase()) || searchTitle == "") {

      <div class="col-md-4 mb-4">

        <div class="card" style="width: 18rem;">

          <img
            [src]="conf.picture"
            class="card-img-top"
            [alt]="conf.title"
            style="height: 180px; object-fit: cover;">

          <div class="card-body">

            <h5 class="card-title">{{ conf.title }}</h5>

            <p class="card-text">
              <strong>Description:</strong> {{ conf.description }}
              <br>

              <strong>Date:</strong> {{ conf.date }}
              <br>

              <strong>Available places:</strong>
              {{ conf.nbrMax - conf.nbrReservation }}
              <br><br>

              <button
                class="btn btn-sm btn-success"
                [disabled]="conf.nbrMax == conf.nbrReservation"
                (click)="participate(conf)">
                Participate
              </button>

            </p>

          </div>

        </div>

      </div>

    }

  }

</div>
